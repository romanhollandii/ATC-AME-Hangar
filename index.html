<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ATC and AME Hangar</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="etvs-shell">

    <header class="system-header">

      <div class="system-label">
        ATC / AME
      </div>

      <div class="system-title">
        <h1>ATC AND AME HANGAR</h1>
        <p>SELECT APPLICATION</p>
      </div>

      <div class="system-status">
        SYSTEM<br>
        READY
      </div>

    </header>


    <section class="selection-panel">

      <a
        href="./ATNAVICS%20Aid/"
        class="etvs-key main-key"
      >
        <span class="key-title">ATNAVICS AID</span>
        <span class="key-subtitle">PREDEPLOYMENT TOOLS</span>
      </a>


      <a
       href="./AME%20Aid/"
        class="etvs-key main-key"
      >
        <span class="key-title">AME AID</span>
        <span class="key-subtitle">AIRFIELD ASSESSMENT</span>
      </a>

    </section>


    <section class="future-panel">

      <div class="etvs-key inactive-key">
        FUTURE TOOL
      </div>

      <div class="etvs-key inactive-key">
        FUTURE TOOL
      </div>

      <div class="etvs-key inactive-key">
        FUTURE TOOL
      </div>

      <div class="etvs-key inactive-key">
        FUTURE TOOL
      </div>

    </section>


    <footer class="system-footer">

      <span>ATC / AME HANGAR</span>

      <span class="ready-indicator">
        ● READY
      </span>

    </footer>

  </main>

</body>

</html>
